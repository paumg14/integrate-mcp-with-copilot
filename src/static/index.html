<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <section id="login-container">
      <h3>Sign in</h3>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">School email:</label>
          <input type="email" id="login-email" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password:</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <button type="submit">Sign in</button>
      </form>
      <div id="login-message" class="hidden" role="status"></div>
    </section>

    <div id="authenticated-content" class="hidden">
      <div class="auth-bar">
        <span id="current-user"></span>
        <button id="logout-button" type="button">Sign out</button>
      </div>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
      </section>
    </main>
      <div id="message" class="hidden" role="status"></div>
    </div>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
